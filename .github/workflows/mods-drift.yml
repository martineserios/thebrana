name: mods-drift

# Weekly drift job for the cockpit mods (ADR-096 Law 6; cockpit.md §ci.yml, t-3427). ci.yml pins
# the claude CLI (env CC_VERSION) so validate is reproducible; this job installs the LATEST
# release and re-runs the engine half of Check 77 against it. A red run is the signal to bump
# CC_VERSION in ci.yml and SUPPORTED in mods/_shared/hooks/probe.ts (then let 77b prove the new
# version), not a failure of dev. It never blocks a merge.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the latest claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          command -v claude || { echo "::error::claude not on PATH after install"; exit 1; }
          claude --version

      - name: Compare the installed version with the supported list
        run: |
          # Informational: names the gap before the engine check runs. SUPPORTED lives in
          # mods/_shared/hooks/probe.ts; CC_VERSION in ci.yml. Both move together on a green bump.
          installed="$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          supported="$(grep -E '^export const SUPPORTED' mods/_shared/hooks/probe.ts)"
          echo "installed: $installed"
          echo "probe.ts:  $supported"
          case "$supported" in
            *"'$installed'"*) echo "installed version is in SUPPORTED" ;;
            *) echo "::warning::claude $installed is not in SUPPORTED — if the engine check below is green, bump CC_VERSION (ci.yml) and SUPPORTED (probe.ts)" ;;
          esac

      - name: Engine check against the latest claude (Check 77b body)
        run: bash system/scripts/mods-check.sh --engine

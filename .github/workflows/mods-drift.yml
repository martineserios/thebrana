name: mods-drift

# Weekly drift job for the cockpit mods (ADR-096 Law 6; cockpit.md §ci.yml, t-3427). ci.yml pins
# the claude CLI (env CC_VERSION) so validate is reproducible; this job installs the LATEST
# release and re-runs the engine half of Check 77 against it. It never blocks a merge. Two red
# outcomes, each with its own message (challenger finding: one signal cannot mean both):
#   - the engine check fails on latest  -> the new engine breaks a mod: fix the mod first;
#   - the engine check passes but latest is not in SUPPORTED -> bump CC_VERSION in ci.yml and
#     SUPPORTED in mods/_shared/hooks/probe.ts together (the job fails so someone is notified).

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the latest claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          command -v claude || { echo "::error::claude not on PATH after install"; exit 1; }
          claude --version

      - name: Engine check against the latest claude (Check 77b body)
        run: |
          if ! bash system/scripts/mods-check.sh --engine; then
            echo "::error::the latest claude breaks a mod (Check 77b body) — fix the mod before bumping the pin"
            exit 1
          fi

      - name: Bump signal — latest passes but is not in SUPPORTED
        run: |
          installed="$(claude --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          supported="$(grep -E '^export const SUPPORTED' mods/_shared/hooks/probe.ts)"
          echo "installed: $installed"
          echo "probe.ts:  $supported"
          case "$supported" in
            *"'$installed'"*) echo "claude $installed is supported — nothing to do" ;;
            *) echo "::error::claude $installed passes the engine check but is not in SUPPORTED — bump CC_VERSION (ci.yml) and SUPPORTED (probe.ts) together"; exit 1 ;;
          esac

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs on any ref — lets a branch prove CI green before it opens the
  # dev->main PR (t-3023 tier-2 valve).
  workflow_dispatch:

# Least privilege (Gate 3, t-3383): none of these jobs writes to the repo or needs a token beyond read.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # A hung suite must fail the job with a name, not sit until GitHub's 6h
    # limit: the first tier-2 rehearsal run (t-3023) spent 70+ minutes inside
    # "Run tests" with no output available until the job ended.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: system/cli/rust

      # validate.sh is the operator's full gate and its hook test sweep (Check 70)
      # drives the real CLI: several suites resolve
      # system/cli/rust/target/release/brana first and fall back to PATH. Without
      # this build the sweep was red on every main run since 2026-08-31 with no
      # assertion visible (t-3023). Same binary the operator's gate uses.
      - name: Build brana CLI (release) for the hook test sweep
        working-directory: system/cli/rust
        run: cargo build --release -p brana-cli

      - name: Run validation
        env:
          # Surface enough of a failing suite to see the assertion, not just its name.
          HOOK_TEST_SWEEP_TAIL: "40"
        run: ./validate.sh

      - name: Check plugin manifest
        run: |
          # Verify plugin.json is valid JSON
          python3 -c "import json; json.load(open('system/.claude-plugin/plugin.json'))"
          # Verify marketplace.json is valid JSON
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Check version sync
        run: |
          # plugin.json and marketplace.json versions must match
          PLUGIN_VER=$(python3 -c "import json; print(json.load(open('system/.claude-plugin/plugin.json'))['version'])")
          MARKET_VER=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          if [ "$PLUGIN_VER" != "$MARKET_VER" ]; then
            echo "Version mismatch: plugin.json=$PLUGIN_VER marketplace.json=$MARKET_VER"
            exit 1
          fi
          echo "Versions match: $PLUGIN_VER"

      - name: Check hook scripts are executable
        run: |
          for script in system/hooks/*.sh; do
            if [ ! -x "$script" ]; then
              echo "Not executable: $script"
              exit 1
            fi
          done
          echo "All hook scripts are executable"

  # tests/*/*.sh — required check on main as of t-3319 (2026-09-07).
  # This step never ran on main until 2026-09-04 (validate failed first for
  # weeks), and its first run showed 14 suites red for reasons ranging from
  # CI-environment gaps (no ruflo, brana not on PATH) to genuinely red tests on
  # dev. t-3280 (2026-09-04) fixed those 14; t-3316 (2026-09-07) fixed a fresh
  # regression of the same suites plus one net-new one; t-3319 (2026-09-07)
  # finally flipped branch protection so a red run here blocks merges to main.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: system/cli/rust

      # Remedies 62/63/64 (test-validate-remedies.sh) shell out to
      # `uv run python3 system/scripts/migrate/*.py --write`. GitHub's
      # ubuntu-latest image doesn't ship uv, so those calls silently exit 127
      # (swallowed by the test's >/dev/null 2>&1) and the remedy no-ops (t-3316).
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build brana CLI (release) and put it on PATH
        working-directory: system/cli/rust
        run: |
          cargo build --release -p brana-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # The loop lives in system/scripts/run-test-suites.sh (t-3376) so the macOS job shares it
      # (stock macOS has no timeout(1)); its behaviour is the loop that used to be inline here:
      # per-suite 300s ceiling, stdin from /dev/null, helper libs skipped, all failures listed.
      - name: Run tests
        run: bash system/scripts/run-test-suites.sh tests/*/*.sh

  # macOS (t-3376) — ADVISORY: not a required check on main, and continue-on-error keeps a red run
  # from failing the workflow while still showing a red job. Promote it to required (branch
  # protection) once it has been green on a few runs.
  #
  # The environment is a *stock Mac + Homebrew bash + jq* on purpose: NO flock(1), NO coreutils
  # (no timeout/gtimeout). That is what the portable.sh fallbacks exist for — the noclobber-file lock and
  # the p_timeout watchdog — so those are what this job exercises. Nothing here installs a GNU tool
  # to make a test pass; a red test means a real portability gap.
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # macOS ships bash 3.2; hooks run as `bash <script>` and 9 scripts need bash >= 4 (t-3378).
      - name: Homebrew bash + jq first on PATH
        run: |
          brew install bash jq
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: system/cli/rust

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Show the environment (what is absent matters as much as what is present)
        run: |
          bash --version | head -1
          for c in bash jq git python3 node uv cargo rsync flock timeout gtimeout; do
            printf '%-10s' "$c"; command -v "$c" || echo "(absent)"
          done
          # macOS 15.4+ swapped rsync for openrsync, whose option set differs — bootstrap.sh drives
          # `rsync -a --delete --itemize-changes`, so record which one this runner has.
          rsync --version 2>&1 | head -2

      # The whole point of this job is the fallbacks (mkdir-free lock, p_timeout watchdog). If the
      # runner image ever ships flock/timeout/gtimeout the job would go green on the GNU fast path
      # and test nothing — so fail loudly instead of passing for the wrong reason.
      - name: Assert the environment is stock (fallbacks are what is under test)
        run: |
          bad=0
          for c in flock timeout gtimeout; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "::error::$c is present ($(command -v "$c")) — the BSD fallbacks would go untested"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]

      # Fast, no-build signals first.
      - name: Portability lint
        run: bash system/scripts/lint-portability.sh

      - name: Shim + runner tests
        run: |
          bash tests/hooks/test-portable.sh
          bash tests/scripts/test-lint-portability.sh
          bash tests/scripts/test-run-test-suites.sh

      - name: Platform preflight (bootstrap.sh --check)
        run: |
          # pipefail: without it the step's status is tee's, and a failing `bootstrap --check` (e.g. the
          # bash >= 4 preflight) could never fail this step.
          set -o pipefail
          ./bootstrap.sh --check 2>&1 | tee /tmp/bootstrap-check.log
          # A failing rsync dry-run (e.g. openrsync without --itemize-changes) makes --check report
          # changes forever though the real deploy works: surface it, don't fail the job for it.
          if grep -q 'dry-run failed' /tmp/bootstrap-check.log; then
            echo "::warning::bootstrap --check: rsync dry-run failed on this runner (see the rsync version above)"
          fi

      - name: Build brana CLI (release) and put it on PATH
        working-directory: system/cli/rust
        run: |
          cargo build --release -p brana-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Run test suites
        run: |
          bash system/scripts/run-test-suites.sh \
            tests/*/*.sh system/hooks/tests/*.sh system/scripts/tests/*.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: system/cli/rust

      - name: Build brana-mcp
        working-directory: system/cli/rust
        run: cargo build -p brana-mcp

      # The only test needing a real cargo artifact. It skips when the binary is
      # absent (see the test header); BRANA_REQUIRE_MCP_BIN turns that skip back
      # into a hard failure here, where the binary IS built — so the t-1650
      # stdio-bleed regression cannot go silently uncovered.
      - name: Run brana-mcp stdio isolation test
        env:
          BRANA_REQUIRE_MCP_BIN: "1"
        run: bash tests/procedures/test-agy-mcp-stdio-isolation.sh

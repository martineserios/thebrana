[package]
name = "rv-spike"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
ruvector-core = { version = "2.4.0", default-features = false, features = ["simd", "hnsw", "storage", "parallel"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
opt-level = 3
